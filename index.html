<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href='https://fonts.googleapis.com/css?family=Roboto Mono' rel='stylesheet'>
    <link href="https://fonts.cdnfonts.com/css/doctor-glitch" rel="stylesheet">
    <title>Lekytov Bio</title>
    <script type="module" crossorigin src="assets/index-DChlvrmW.js"></script>
    <link rel="stylesheet" crossorigin href="assets/index-DPfygzNe.css">
    <style>
      .play-button {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        border: none;
        cursor: pointer;
        z-index: 1;
      }

      #buy-melon-container {
        position: fixed;
        left: 20px;
        bottom: 20px;
        background-color: black;
        padding: 10px;
        border-radius: 10px;
        z-index: 9999;
      }

      #buy-melon-btn {
        color: white;
        background: transparent;
        border: 2px solid white;
        padding: 10px 15px;
        cursor: pointer;
        font-size: 16px;
        border-radius: 5px;
      }

      #melon-image {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 9998;
      }

      /* Overlay */
      #overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        color: white;
        font-size: 28px;
        z-index: 10000;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Overlay -->
    <div id="overlay">✨Люблю блондинок✨</div>

    <!-- Фоновая музыка -->
    <audio id="background-music" src="assets/bg.mp3" loop></audio>

    <!-- Кнопка и медиа -->
    <div id="buy-melon-container">
      <button id="buy-melon-btn">Купить арбуз 🍉</button>
    </div>

    <img id="melon-image" src="" alt="Арбуз на весь экран" />
    <audio id="melon-audio" loop></audio>

    <script>
      let bgAudio;

      // Оверлей — скрыть и запустить фоновую музыку
      const overlay = document.getElementById('overlay');
      const backgroundMusic = document.getElementById('background-music');

      overlay.addEventListener('click', () => {
        overlay.style.display = 'none';
        const playPromise = backgroundMusic.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => console.error("Ошибка воспроизведения музыки:", err));
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        bgAudio = backgroundMusic;
        const btn = document.getElementById('buy-melon-btn');
        const img = document.getElementById('melon-image');
        const melonAudio = document.getElementById('melon-audio');

         btn.addEventListener('click', () => {
          if (btn.textContent.includes('Купить')) {
            // Меняем кнопку на "Назад"
            btn.textContent = 'Арбузы хуйня';

            const melonAudioUrl = 'assets/song.mp3';
            const melonImageUrl = 'assets/melon-full.png';

            // Остановить фоновую музыку
            if (bgAudio && !bgAudio.paused) {
              bgAudio.pause();
              bgAudio.currentTime = 0;
            }

            // Воспроизвести музыку арбуза
            melonAudio.src = melonAudioUrl;
            melonAudio.play();

            // Показать изображение
            img.src = melonImageUrl;
            img.style.display = 'block';
          } else {
            // Возврат обратно
            btn.textContent = 'Купить арбуз 🍉';

            // Скрыть изображение арбуза
            img.style.display = 'none';
            
// Остановить музыку арбуза
            melonAudio.pause();
            melonAudio.currentTime = 0;

            // Включить фоновую музыку снова
            bgAudio.play();
          }
        });

        // Также можно закрыть арбуз кликом по нему
        img.addEventListener('click', () => {
          img.style.display = 'none';
          melonAudio.pause();
          melonAudio.currentTime = 0;
          btn.textContent = 'Купить арбуз 🍉';
          bgAudio.play();
        });
      });
    </script>
  </body>
</html>
